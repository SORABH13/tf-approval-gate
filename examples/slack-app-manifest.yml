display_information:
  name: TF Approval Gate
  description: Human approval gate for AI-agent-driven Terraform changes.
  background_color: "#4A154B"
features:
  bot_user:
    display_name: tf-approval-gate
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  event_subscriptions:
    bot_events: []
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
