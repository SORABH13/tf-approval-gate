name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Install Checkov
        run: pip install checkov

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + e2e tests
        run: npm test
        env:
          TF_APPROVAL_GATE_SECRET: ci-test-secret-not-for-production

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t tf-approval-gate:ci .

      - name: Verify preinstalled binaries
        run: |
          docker run --rm --entrypoint terraform tf-approval-gate:ci -version
          docker run --rm --entrypoint checkov tf-approval-gate:ci --version
          docker run --rm --entrypoint conftest tf-approval-gate:ci --version
